<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Is Tom Holland Exploded Yet?</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
      padding: 2rem;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .answer {
      font-size: clamp(4rem, 20vw, 12rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #4ade80; /* зелёный для NO */
    }
    .answer.yes { color: #f87171; } /* красный для YES */
    h1 { font-size: 1.5rem; font-weight: 500; opacity: 0.8; }
    .sub { margin-top: 2rem; font-size: 0.9rem; opacity: 0.5; max-width: 30rem; }
    footer { font-size: 0.8rem; opacity: 0.5; }
  </style>
</head>
<body>
  <main>
    <h1>Is Tom Holland exploded yet?</h1>
    <div class="answer" id="answer">NO</div>
    <p class="sub">
      Last checked: <span id="timestamp"></span>
    </p>
  </main>
  <footer>Satire. Not affiliated with Tom Holland or The Weekly Planet.</footer>

  <script>
    // Пока просто статичный ответ
    document.getElementById('timestamp').textContent = new Date().toLocaleString('en-GB');
  </script>
</body>
</html>
